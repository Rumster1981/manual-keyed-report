<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Keyed Report">

<title>Manual Keyed Report</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}body{font:18px -apple-system,sans-serif;margin:0;padding:8px 10px 40px;background:#f4f4f4}
h1{font-size:18px;margin:4px 0}.row{display:flex;gap:6px}.row>*{flex:1}
input,select,textarea{font-size:20px;padding:12px;width:100%;border:1px solid #aaa;border-radius:10px;margin:3px 0}
button{font-size:18px;padding:12px;border:0;border-radius:10px;background:#ddd;margin:3px 0}
#save{background:#c8102e;color:#fff;font-size:26px;width:100%;padding:20px;font-weight:bold}
.deps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.deps button{padding:14px 4px;font-size:15px}
.deps button.on,.rs button.on{background:#0a7d3b;color:#fff}.rs{display:flex;gap:6px}.rs button{flex:1;padding:16px}

.blk{background:#fff;border-radius:12px;padding:6px;margin:6px 0;border:3px solid transparent}.blk.act{border-color:#0a5fb4}.bt{font-weight:bold;font-size:15px}
.reader{position:relative;width:100%;height:170px;background:#000;border-radius:10px;overflow:hidden}.reader video,.reader canvas{width:100%;height:100%;object-fit:contain;display:block}.reader canvas{display:none}.reader canvas{transform-origin:0 0;touch-action:none}.reader.st{touch-action:none}.zb{position:absolute;right:4px;top:4px;z-index:2;display:none;gap:3px}.reader.st .zb{display:flex}.zb button{margin:0;padding:4px 10px;font-size:18px;background:#fffc}.ph{position:absolute;inset:0;color:#aaa;display:flex;align-items:center;justify-content:center}
#vid{display:none}.reader #vid{display:block;object-fit:cover}.cam{display:flex;gap:6px}.snap{flex:3;flex:3;background:#0a5fb4;color:#fff;font-size:22px;padding:16px;font-weight:bold}.redo,.upb{flex:1;font-size:16px}
.th{width:44px;height:44px;object-fit:cover;margin:1px;cursor:pointer}#big{position:fixed;inset:0;background:#000d;display:none;z-index:9}#big img{width:100%;height:100%;object-fit:contain}.pi{max-width:160px;max-height:120px;margin:2px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}td,th{border:1px solid #444;padding:4px}
.tools{display:flex;flex-wrap:wrap;gap:5px}.tools button{flex:1}#msg{font-size:14px;color:#555;min-height:18px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}body{background:#fff}#pr h2{text-align:center}}
</style></head><body>
<h1>Manual Keyed Report <span id="dt"></span></h1>
<div class="row"><input id="reg" name="mkr_register" placeholder="Register #" inputmode="numeric" autocomplete="off"><input id="nm" name="mkr_cashier" placeholder="Name" autocomplete="off" autocorrect="off"></div>
<div class="blk" id="bu"><div class="bt">UPC picture</div><div class="reader" id="ru"><canvas id="cu"></canvas><div class="zb"><button data-z="+">+</button><button data-z="-">−</button><button data-z="0">⟲</button></div><div class="ph">Tap 📸 to use camera</div></div>
<div class="cam"><button class="snap" data-b="u">📸 Take picture</button><button class="redo" data-b="u">↺ Redo</button><button class="upb" data-b="u">🖼 Upload</button><input id="fu" type="file" accept="image/*" hidden></div>
<input id="upc" name="mkr_upc" placeholder="UPC" inputmode="numeric" autocomplete="off"></div>
<div class="blk" id="bl"><div class="bt">Label picture</div><div class="reader" id="rl"><canvas id="cl"></canvas><div class="zb"><button data-z="+">+</button><button data-z="-">−</button><button data-z="0">⟲</button></div><div class="ph">Tap 📸 to use camera</div></div>
<div class="cam"><button class="snap" data-b="l">📸 Take picture</button><button class="redo" data-b="l">↺ Redo</button><button class="upb" data-b="l">🖼 Upload</button><input id="fl" type="file" accept="image/*" hidden></div>
<input id="pn" name="mkr_item_desc" placeholder="Product name" autocomplete="off" autocorrect="off" spellcheck="false"></div>
<video id="vid" playsinline muted autoplay></video>
<div id="msg"></div>
<input id="price" name="mkr_amt" placeholder="Price" inputmode="decimal" autocomplete="off">
<div class="deps" id="deps"></div>
<div class="rs"><button data-r="Not on file" class="on">Not on file</button><button data-r="Other">Other</button></div>
<input id="oth" name="mkr_why" autocomplete="off" placeholder="Reason (required)" style="display:none">
<button id="save">SAVE ✓</button>
<h1>Entries (<span id="cnt">0</span>)</h1>
<table><thead><tr><th>Product</th><th>UPC</th><th>Price</th><th>Dept</th><th>Reason</th><th>Name</th><th>Photos</th><th></th></tr></thead><tbody id="tb"></tbody></table>
<div class="tools"><button onclick="print()">Print</button><button id="csv">CSV / Share</button><button id="clr">Clear all</button><button id="ed">Edit depts</button></div>
<div id="pr"></div><div id="big" onclick="this.style.display='none'"><img id="bigi"></div>
<script>
const $=id=>document.getElementById(id),L=localStorage;
const today=new Date().toLocaleDateString();$('dt').textContent=today;
let deps=JSON.parse(L.deps2||'null')||['Grocery','Grocery Taxable','General Mdse','HBC','Deli','Produce','Meat','Seafood','Bakery','Prepared Food','Floral','Kosher Meat','Sushi','Kosher Deli','Tobacco','Beer/Wine','Bottle Deposit','Charity','Starbucks','RX','Tele In','H/D In','Tele Out','H/D Out'];
let dep=L.dep||'Grocery',reason='Not on file',items=JSON.parse(L.items||'[]'),editIx=-1;
$('reg').value=L.reg||'';$('nm').value=L.nm||'Clark';
$('reg').onchange=()=>L.reg=$('reg').value;$('nm').onchange=()=>L.nm=$('nm').value;
function drawDeps(){$('deps').innerHTML='';deps.forEach(d=>{const b=document.createElement('button');b.textContent=d;if(d==dep)b.className='on';b.onclick=()=>{dep=d;L.dep=d;drawDeps()};$('deps').appendChild(b)})}drawDeps();
document.querySelectorAll('.rs button').forEach(b=>b.onclick=()=>setR(b.dataset.r));
function setR(r){reason=r;document.querySelectorAll('.rs button').forEach(x=>x.classList.toggle('on',x.dataset.r==r));$('oth').style.display=r=='Other'?'block':'none';if(r=='Other')$('oth').focus()}
const msg=t=>$('msg').textContent=t;
function crops(src){const W=src.width,H=src.height,out=[];
 const mk=(x,y,w,h,rot,boost)=>{const c=document.createElement('canvas');const s=Math.min(1,1600/Math.max(w,h));const cw=Math.round(w*s),ch=Math.round(h*s);
  c.width=rot?ch:cw;c.height=rot?cw:ch;const g=c.getContext('2d');if(rot){g.translate(c.width/2,c.height/2);g.rotate(Math.PI/2);g.drawImage(src,x,y,w,h,-cw/2,-ch/2,cw,ch)}else g.drawImage(src,x,y,w,h,0,0,cw,ch);
  if(boost){const d=g.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let v=.3*p[i]+.59*p[i+1]+.11*p[i+2];v=Math.max(0,Math.min(255,(v-128)*2+128));p[i]=p[i+1]=p[i+2]=v}g.putImageData(d,0,0)}return c};
 for(const boost of[false,true])for(const rot of[false,true]){out.push(mk(0,0,W,H,rot,boost));out.push(mk(W*.1,H*.25,W*.8,H*.5,rot,boost));out.push(mk(W*.2,H*.1,W*.6,H*.8,rot,boost))}return out}
let zx;function zxDecode(c){if(!window.ZXing)return null;if(!zx){zx=new ZXing.MultiFormatReader();const h=new Map();const F=ZXing.BarcodeFormat;h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.UPC_A,F.UPC_E,F.EAN_13,F.EAN_8,F.CODE_128]);h.set(ZXing.DecodeHintType.TRY_HARDER,true);zx.setHints(h)}
 try{const ls=new ZXing.HTMLCanvasElementLuminanceSource(c);return zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(ls))).getText()}catch(e){return null}}
const ck=s=>{if(!/^\d+$/.test(s)||![8,12,13].includes(s.length))return false;const d=s.split('').map(Number),c=d.pop();let t=0;d.reverse().forEach((x,i)=>t+=x*(i%2?1:3));return (10-t%10)%10==c};
const okCode=t=>{t=(t||'').replace(/\D/g,'');return t.length==12||t.length==13||t.length==8?(ck(t)?t:null):(t.length>=6?t:null)};
async function decodeStill(){if('BarcodeDetector'in window){try{const bd=new BarcodeDetector({formats:['upc_a','upc_e','ean_13','ean_8','code_128']});for(const c of[st,...crops(st).slice(0,6)]){const r=await bd.detect(c);for(const x of r){const v=okCode(x.rawValue);if(v)return v}}}catch(e){}}
 for(const c of crops(st)){const v=okCode(zxDecode(c));if(v)return v;await new Promise(r=>setTimeout(r,0))}return null}
let tw,twP;function loadT(){return twP||(twP=(async()=>{if(!window.Tesseract)await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://unpkg.com/tesseract.js@5/dist/tesseract.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)});tw=await Tesseract.createWorker('eng');return tw})().catch(e=>{twP=null;throw e}))}
setTimeout(()=>loadT().catch(()=>{}),300);
async function ocr(c,digits){await loadT();await tw.setParameters({tessedit_char_whitelist:digits?'0123456789':'',tessedit_pageseg_mode:digits?'6':'11'});return (await tw.recognize(c)).data}
async function ocrDigits(){for(const c of[prep(st,'stretch'),prep(st,'bin')]){try{const d=await ocr(c,true);const t=(d.text||'').replace(/[^\d]/g,'');for(const n of[12,13])for(let i=0;i+n<=t.length;i++){const w=t.substr(i,n);if(ck(w))return w}}catch(e){}}return null}
async function readLabel(){const seen=new Map();for(const mode of['stretch','inv','bin']){let d;try{d=await ocr(prep(st,mode),false)}catch(e){continue}
  for(const w of d.words||[]){const t=w.text.replace(/^[^\w&]+|[^\w&'.]+$/g,'').replace(/[^\w'&.-]/g,'');if(w.confidence<60||!realWord(t))continue;const k=t.toLowerCase(),h=w.bbox.y1-w.bbox.y0,o=seen.get(k);if(!o||o.h<h)seen.set(k,{t,h,y:w.bbox.y0,x:w.bbox.x0})}}
 return [...seen.values()].sort((a,b)=>b.h-a.h||a.y-b.y||a.x-b.x).slice(0,6).map(w=>w.t).join(' ')}
const vid=$('vid');let stream=null,st=null,act=null;const have={u:false,l:false},tok={u:0,l:0};
function showStill(k,on){if(Z[k]&&have[k]!==on)zr(k);have[k]=on;$('r'+k).classList.toggle('st',on);$('c'+k).style.display=on?'block':'none';$('r'+k).querySelector('.ph').style.display=on?'none':'flex'}
async function activate(k){act=k;['u','l'].forEach(x=>$('b'+x).classList.toggle('act',x==k));showStill(k,false);$('r'+k).appendChild(vid);$('r'+k).querySelector('.ph').style.display='none';
 try{if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});vid.srcObject=stream}await vid.play()}catch(e){msg('Camera unavailable – use Upload or type. '+e)}}
function idle(){act=null;document.body.appendChild(vid);['u','l'].forEach(x=>showStill(x,have[x]));['u','l'].forEach(x=>$('b'+x).classList.remove('act'))}
function next(){const k=!have.u&&!$('upc').value?'u':!have.l?'l':null;if(k)activate(k);else idle()}
async function proc(k,src,w,h){const c=$('c'+k);c.width=w;c.height=h;c.getContext('2d').drawImage(src,0,0,w,h);if(act==k)idle();showStill(k,true);const my=++tok[k];st=c;
 if(k=='u'){msg('Reading UPC…');$('upc').value='';let v=await decodeStill();if(!v){msg('Reading printed numbers…');st=c;v=await ocrDigits()}if(my!=tok.u)return;
  if(v){navigator.vibrate&&navigator.vibrate(80);$('upc').value=v;msg('UPC '+v+' ✓');if(!have.l)activate('l')}else msg('UPC not clear – ↺ Redo (fill frame, avoid glare), or type it from the picture')}
 else{msg('Reading label…');const old=$('pn').value;let t='';try{t=await readLabel()}catch(e){}if(my!=tok.l)return;
  if(old)msg('Kept the name you typed');else if(t){$('pn').value=t;msg('Check/edit the name')}else msg('Could not read label – type the name from the picture');$('price').focus()}}
document.querySelectorAll('.snap').forEach(b=>b.onclick=()=>{const k=b.dataset.b;if(act!=k||!vid.videoWidth)return activate(k);proc(k,vid,vid.videoWidth,vid.videoHeight)});
document.querySelectorAll('.redo').forEach(b=>b.onclick=()=>{const k=b.dataset.b;tok[k]++;if(k=='u')$('upc').value='';activate(k);msg('')});
document.querySelectorAll('.upb').forEach(b=>b.onclick=()=>$('f'+b.dataset.b).click());
['u','l'].forEach(k=>$('f'+k).onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));proc(k,im,Math.round(im.naturalWidth*s),Math.round(im.naturalHeight*s));URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f);e.target.value=''});
function resetBlocks(){tok.u++;tok.l++;showStill('u',false);showStill('l',false);activate('u')}
// photo storage (IndexedDB)
const dbp=new Promise((r,j)=>{const q=indexedDB.open('mkr',1);q.onupgradeneeded=()=>q.result.createObjectStore('ph');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const idb=async(m,f)=>{const d=await dbp;return new Promise((r,j)=>{const t=d.transaction('ph',m),q=f(t.objectStore('ph'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)})};
const putPh=(id,v)=>idb('readwrite',s=>s.put(v,id)),getPh=id=>idb('readonly',s=>s.get(id)),delPh=id=>idb('readwrite',s=>s.delete(id));
function jpg(k){if(!have[k])return null;const c=$('c'+k),s=Math.min(1,800/c.width),o=document.createElement('canvas');o.width=Math.round(c.width*s);o.height=Math.round(c.height*s);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/jpeg',.7)}

const Z={};function zs(k,z,tx,ty){const r=$('r'+k),W=r.clientWidth,H=r.clientHeight;z=Math.max(1,Math.min(5,z));tx=Math.min(0,Math.max(W-W*z,tx));ty=Math.min(0,Math.max(H-H*z,ty));Z[k]={z,tx,ty};$('c'+k).style.transform=`translate(${tx}px,${ty}px) scale(${z})`}
function zAt(k,nz,px,py){const o=Z[k]||{z:1,tx:0,ty:0};const f=Math.max(1,Math.min(5,nz))/o.z;zs(k,o.z*f,px-(px-o.tx)*f,py-(py-o.ty)*f)}
const zr=k=>zs(k,1,0,0);
['u','l'].forEach(k=>{const r=$('r'+k),P=new Map();let last=0,d0=0,z0=1,m0=null;zr(k);
 r.querySelectorAll('.zb button').forEach(b=>{b.onpointerdown=e=>e.stopPropagation();b.onclick=e=>{e.stopPropagation();const W=r.clientWidth/2,H=r.clientHeight/2,o=Z[k];b.dataset.z=='0'?zr(k):zAt(k,o.z*(b.dataset.z=='+'?1.5:1/1.5),W,H)}});
 const pt=e=>{const b=r.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 r.addEventListener('pointerdown',e=>{if(!have[k])return;r.setPointerCapture(e.pointerId);P.set(e.pointerId,pt(e));
  if(P.size==2){const[a,b]=[...P.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);z0=Z[k].z}m0=pt(e)});
 r.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;e.preventDefault();const p=pt(e),q=P.get(e.pointerId);P.set(e.pointerId,p);
  if(P.size==2){const[a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d0)zAt(k,z0*d/d0,(a[0]+b[0])/2,(a[1]+b[1])/2)}
  else if(Z[k].z>1){const o=Z[k];zs(k,o.z,o.tx+p[0]-q[0],o.ty+p[1]-q[1])}});
 const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);d0=0;if(e.type!='pointerup'||P.size)return;const p=pt(e);
  if(m0&&Math.hypot(p[0]-m0[0],p[1]-m0[1])<15){const t=Date.now();if(t-last<300){Z[k].z>1?zr(k):zAt(k,2.5,p[0],p[1]);last=0}else last=t}};
 r.addEventListener('pointerup',up);r.addEventListener('pointercancel',up);
 r.addEventListener('touchmove',e=>{if(have[k])e.preventDefault()},{passive:false});r.addEventListener('gesturestart',e=>e.preventDefault())});
window.big=src=>{$('bigi').src=src;$('big').style.display='block'};
function prep(img,mode){const sc=Math.min(2.5,Math.max(1,1600/Math.max(img.width,img.height))),c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
 const d=g.getImageData(0,0,c.width,c.height),p=d.data,hist=new Uint32Array(256),n=p.length/4;for(let i=0;i<p.length;i+=4){const v=(.3*p[i]+.59*p[i+1]+.11*p[i+2])|0;p[i]=v;hist[v]++}
 let lo=0,hi=255,acc=0;while(lo<255&&(acc+=hist[lo])<n*.02)lo++;acc=0;while(hi>0&&(acc+=hist[hi])<n*.02)hi--;if(hi<=lo){lo=0;hi=255}let sum=0;
 for(let i=0;i<p.length;i+=4){let v=Math.max(0,Math.min(255,(p[i]-lo)*255/(hi-lo)));if(mode=='inv')v=255-v;p[i]=v;sum+=v}const m=sum/n;
 for(let i=0;i<p.length;i+=4){let v=p[i];if(mode=='bin')v=v>m?255:0;p[i]=p[i+1]=p[i+2]=v}g.putImageData(d,0,0);return c}
const realWord=w=>/^[A-Za-z][A-Za-z'&.-]*$/.test(w)&&w.length>=2&&/[aeiouyAEIOUY]/.test(w)&&!/(.)\1\1/.test(w)||/^\d+(\.\d+)?(oz|fl|ct|lb|g|ml|L)$/i.test(w);
$('save').onclick=async()=>{const it={id:(editIx>=0&&items[editIx].id)||Date.now()+'',pn:$('pn').value.trim(),upc:$('upc').value.trim(),price:$('price').value.trim(),dep,reason:reason=='Other'?$('oth').value.trim():reason,nm:$('nm').value,reg:$('reg').value,date:today};
 if(!it.upc&&!it.pn)return msg('Need a UPC or name');if(!it.price)return $('price').focus(),msg('Enter price');if(reason=='Other'&&!it.reason)return $('oth').focus(),msg('Enter reason');
 if(it.price&&!isNaN(it.price))it.price=(+it.price).toFixed(2);
 const ph={u:jpg('u'),l:jpg('l')};if(ph.u||ph.l||editIx<0)try{await putPh(it.id,ph)}catch(e){msg('Photo save failed: '+e)}
 if(editIx>=0){items[editIx]=it;editIx=-1}else items.push(it);L.items=JSON.stringify(items);draw();
 ['pn','upc','price','oth'].forEach(i=>$(i).value='');setR('Not on file');resetBlocks();msg('Saved ✓ – take next UPC picture')};
function draw(){$('cnt').textContent=items.length;$('tb').innerHTML=items.map((t,i)=>`<tr><td>${esc(t.pn)}</td><td>${t.upc}</td><td>${t.price}</td><td>${esc(t.dep)}</td><td>${esc(t.reason)}</td><td>${esc(t.nm)}</td><td id="tp${i}"></td><td><button onclick="ed(${i})">✎</button><button onclick="del(${i})">✕</button></td></tr>`).join('');
 $('pr').innerHTML=`<h2>Manual Keyed Report</h2><p>Date: ${today} &nbsp; Register #: ${esc($('reg').value)}</p><table><tr><th>Product Name</th><th>UPC</th><th>Price</th><th>Department</th><th>Reason</th><th>Name</th><th>Photos</th></tr>${items.map((t,i)=>`<tr><td>${esc(t.pn)}</td><td>${t.upc}</td><td>$${t.price}</td><td>${esc(t.dep)}</td><td>${esc(t.reason)}</td><td>${esc(t.nm)}</td><td id="pp${i}"></td></tr>`).join('')}</table>`;
 items.forEach(async(t,i)=>{if(!t.id)return;let p;try{p=await getPh(t.id)}catch(e){}if(!p)return;const im=[p.u,p.l].filter(Boolean);const a=$('tp'+i),b=$('pp'+i);if(a)a.innerHTML=im.map(x=>`<img class="th" src="${x}" onclick="big(this.src)">`).join('');if(b)b.innerHTML=im.map(x=>`<img class="pi" src="${x}">`).join('')})}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.del=i=>{if(confirm('Delete?')){if(items[i].id)delPh(items[i].id).catch(()=>{});items.splice(i,1);L.items=JSON.stringify(items);draw()}};
